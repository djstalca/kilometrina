name: Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      # Run build variants sequentially. Room KSP writes schema JSON to a shared
      # schema directory; scheduling debug and release KSP in one Gradle graph
      # can race and leave a partially written schema file.
      - name: Build debug APK
        run: gradle --no-daemon --no-parallel :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon --no-parallel :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon --no-parallel :app:lintDebug

      - name: Build release AAB
        run: gradle --no-daemon --no-parallel :app:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kilometrina-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified release AAB
        uses: actions/upload-artifact@v4
        with:
          name: kilometrina-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
