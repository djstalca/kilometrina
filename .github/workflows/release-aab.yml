name: Build signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APPROVED_CERT_SHA256: AB175B9564EF6DE688416C0FDFD59A8AEE258A01396A449D5976FCE954F9F593

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Verify signing secrets and certificate identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kilometrina-upload.jks"

          ACTUAL_CERT_SHA256="$(
            keytool -list -v \
              -keystore "$RUNNER_TEMP/kilometrina-upload.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]'
          )"

          test "$ACTUAL_CERT_SHA256" = "$APPROVED_CERT_SHA256" || {
            echo "Signing certificate fingerprint does not match docs/SIGNING_POLICY.md"
            echo "Expected: $APPROVED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          }

      - name: Run release unit tests
        env: &signing_env
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kilometrina-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --no-parallel :app:testReleaseUnitTest

      - name: Run release lint
        env: *signing_env
        run: gradle --no-daemon --no-parallel :app:lintRelease

      - name: Build signed APK
        env: *signing_env
        run: gradle --no-daemon --no-parallel :app:assembleRelease

      - name: Build signed AAB
        env: *signing_env
        run: gradle --no-daemon --no-parallel :app:bundleRelease

      - name: Verify APK signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

          APK_CERT_SHA256="$(
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]'
          )"

          test "$APK_CERT_SHA256" = "$APPROVED_CERT_SHA256" || {
            echo "APK was signed by the wrong certificate"
            echo "Expected: $APPROVED_CERT_SHA256"
            echo "Actual:   $APK_CERT_SHA256"
            exit 1
          }

      - name: Verify AAB signing certificate
        run: |
          jarsigner -verify -strict -certs app/build/outputs/bundle/release/app-release.aab

          AAB_CERT_SHA256="$(
            keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]'
          )"

          test "$AAB_CERT_SHA256" = "$APPROVED_CERT_SHA256" || {
            echo "AAB was signed by the wrong certificate"
            echo "Expected: $APPROVED_CERT_SHA256"
            echo "Actual:   $AAB_CERT_SHA256"
            exit 1
          }

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: kilometrina-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
